<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carbon Savings Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

  <div class="container">
    <img src="banner.png" alt="Banner" />
    <div class="content">
      <h2>♻️ Carbon Savings Calculator</h2>
      <p>See how much carbon you can save by switching from virgin to PCR plastic packaging—and get a custom report delivered to your inbox.</p>

      <form id="form">
	   <label for="name">Your Name:</label>
  <input type="text"   name="user_name"     id="name" placeholder="John Doe" />
        <label for="email">Your Email:</label>

  <input type="email"  name="email"         id="email" placeholder="you@example.com" />
        <label for="plasticWeight">Plastic Used Per Year (kg):</label>

  <input type="number" name="plasticWeight" id="plasticWeight" placeholder="kg/year" />
  
  <!-- Hidden fields for template -->
  <input type="hidden" name="virgin_co2"  />
  <input type="hidden" name="pcr_co2"     />
  <input type="hidden" name="savings"     />
  <input type="hidden" name="cars_off"    />
  <input type="hidden" name="report_image" />
  
  <div class="result" id="output" style="display:none;"></div>

  <input type="submit" id="button" value="Send Email">
</form>
<script src="script.js"></script>

      <div class="result" id="output" style="display:none;"></div>
      <button id="downloadBanner" class="download-btn" style="display:none;">Download Result Image</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
