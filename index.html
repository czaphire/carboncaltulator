<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0"
  />
  <title>Recree8® Impact Calculator</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-pMV+X4…your-integrity-hash…"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Recree8® Impact Calculator</h1>
  </header>

  <main class="container">
    <!-- Input Card -->
    <section class="card input-card">
      <h2>Enter Your Details & Plastic Mass</h2>

      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Your Name" required />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      />

      <div class="input-group">
        <input
          type="number"
          id="massKg"
          placeholder="Mass in kg"
          min="0"
          step="0.1"
        />
        <button id="compareBtn">Run LCA</button>
      </div>
    </section>

    <!-- Executive Summary -->
    <section id="execSummarySection" class="card exec-card hidden">
      <h2>Executive Summary</h2>
      <p id="execSummaryText" class="exec-text"></p>
    </section>

    <!-- Metrics Section -->
    <section id="metricsSection" class="metrics hidden">
      <div class="metric-card">
        <i class="fas fa-recycle"></i>
        <div class="metric-value"><span id="metricPlastic">0</span></div>
        <div class="metric-label">
          Plastic Displaced<br>
          <span class="metric-unit">(kg)</span>
        </div>
      </div>
      <div class="metric-card">
        <i class="fas fa-cloud"></i>
        <div class="metric-value"><span id="metricCO2">0</span></div>
        <div class="metric-label">
          CO₂e Avoided<br>
          <span class="metric-unit">(kg)</span>
        </div>
      </div>
      <div class="metric-card">
        <i class="fas fa-water"></i>
        <div class="metric-value"><span id="metricWater">0</span></div>
        <div class="metric-label">
          Water Saved<br>
          <span class="metric-unit">(litres)</span>
        </div>
      </div>
      <div class="metric-card">
        <i class="fas fa-bolt"></i>
        <div class="metric-value"><span id="metricEnergy">0</span></div>
        <div class="metric-label">
          Energy Saved<br>
          <span class="metric-unit">(kWh)</span>
        </div>
      </div>
    </section>

    <!-- Chart 1: CO₂e Emissions -->
    <section id="chart1Section" class="card chart-card hidden">
      <h2>CO₂e Emissions</h2>
      <canvas id="emissionChart"></canvas>
    </section>

    <!-- Chart 2: Impacts Comparison -->
    <section id="chart2Section" class="card chart-card hidden">
      <h2>Impacts Comparison</h2>
      <canvas id="savingsChart"></canvas>
    </section>

    <!-- Methodology Appendix (collapsible) -->
    <section id="methodologySection" class="card methodology-card hidden">
      <div id="methodToggle" class="methodology-header">
        <h2>Methodology Appendix</h2>
        <i id="toggleIcon" class="fas fa-chevron-down"></i>
      </div>
      <table id="methodologyTable" class="methodology-table hide">
        <thead>
          <tr><th>Metric</th><th>Formula</th></tr>
        </thead>
        <tbody><!-- injected by JS --></tbody>
      </table>
    </section>

    <!-- Certification Badge -->
    <div id="certBadge" class="cert-badge hidden">
      <i class="fas fa-check-circle"></i>
      <span>Verified by GECA &amp; Thinkpac LCA</span>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2025 thinkpac.com.au
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
